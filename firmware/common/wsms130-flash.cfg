# Overrides for basicmac/tools/openocd/flash.cfg (must be loaded after it).
# OpenOCD 0.12's stm32lx driver does not implement flash protection, so the
# "unlock" option of "flash write_image" fails; write without it.

# Write image, then verify it; a mismatch raises an error so make fails.
# Output of commands run inside a proc is not logged, hence the echo.
proc write_verify { file args } {
    flash write_image erase $file {*}$args
    verify_image $file {*}$args
    echo "flashed and verified $file ([file size $file] bytes)"
}

proc flash_binary { filename } {
    init
    reset init
    halt
    write_verify $filename 0x08000000
    sleep 100
    reset run
    shutdown
}

proc flash_fw { firmware } {
    init
    reset init
    halt
    write_verify $firmware 0x08003000
    sleep 100
    reset run
    shutdown
}

proc flash_up { update } {
    set size [file size $update]
    set addr [expr [expr 0x08020000 - $size] & 0xFFFFFF80]
    init
    reset init
    halt
    write_verify $update $addr
    puts "update start address: 0x[format %08X $addr]"
    puts "gdb: call set_update(0x[format %08X $addr])"
    sleep 100
    reset run
    shutdown
}

proc flash_ihex { ihex } {
    init
    reset init
    halt
    write_verify $ihex
    sleep 100
    reset run
    shutdown
}
